name: AgentTape Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:plugin-release
      - run: git ls-files --error-unmatch plugins/agenttape/dist/mcp-server.mjs plugins/agenttape/dist/agenttape-cli.mjs plugins/agenttape/dist/verify-capture.mjs
      - run: npm run build:plugin
      - run: git diff --exit-code -- plugins/agenttape/dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --title "AgentTape ${GITHUB_REF_NAME#v}" --generate-notes
